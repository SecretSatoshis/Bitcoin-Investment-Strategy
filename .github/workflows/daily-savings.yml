name: Daily data and notebooks

on:
  pull_request:
  repository_dispatch:
    types: [report-library-updated]
  schedule:
    # Backup cron if repository_dispatch from Bitcoin-Report-Library is missed.
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      as_of:
        description: "Optional YYYY-MM-DD backfill cutoff date"
        required: false
        type: string

permissions: {}

concurrency:
  group: bitcoin-daily-savings-${{ github.ref }}
  cancel-in-progress: false

# Use the runner's refreshed CA bundle rather than Node's embedded roots.
env:
  NODE_OPTIONS: --use-openssl-ca
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      executed_notebooks_artifact_id: ${{ steps.upload-notebooks.outputs.artifact-id }}
    env:
      MPLBACKEND: module://matplotlib_inline.backend_inline
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Refresh TLS certificate trust
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --only-upgrade -y ca-certificates
          # Enforce the emergency distrust even if this runner's apt mirror lags.
          sudo sed -i \
            -e 's|^mozilla/emSign_ECC_Root_CA_-_G3.crt$|!&|' \
            -e 's|^mozilla/emSign_Root_TLS_CA_-_G3.crt$|!&|' \
            -e 's|^mozilla/Comodo_AAA_Services_root.crt$|!&|' \
            /etc/ca-certificates.conf
          sudo update-ca-certificates
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.4"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint with ruff
        run: uvx ruff==0.11.4 check src scripts tests

      - name: Run regression contracts
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Validate committed data and dry-run savings report on pull requests
        if: github.event_name == 'pull_request'
        run: |
          uv run --no-sync python scripts/validate_data.py
          uv run --no-sync python scripts/validate_savings_report.py --dry-run-export

      - name: Refresh the data release
        if: github.event_name != 'pull_request'
        env:
          AS_OF_INPUT: ${{ inputs.as_of }}
        run: |
          if [ -n "${AS_OF_INPUT}" ]; then
            uv run --no-sync python scripts/update_data.py --as-of "${AS_OF_INPUT}" --wait-minutes 0
          else
            uv run --no-sync python scripts/update_data.py --wait-minutes 10
          fi

      - name: Validate the data release
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python scripts/validate_data.py

      - name: Execute the notebooks and export daily HTML
        if: github.event_name != 'pull_request'
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: |
          uv run --no-sync python scripts/execute_notebooks.py \
            --timeout 1200 \
            --executed-dir build/executed-notebooks \
            --html-dir build/pages

      - name: Validate the notebook did not alter the data release
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python scripts/validate_data.py

      - name: Validate the savings report against this release
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python scripts/validate_savings_report.py

      - name: Restrict generated changes
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python scripts/check_changed_paths.py

      - name: Upload validated run
        if: success() && github.event_name != 'pull_request'
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bitcoin-investment-strategy-${{ github.run_id }}
          path: |
            data/manifests/data_manifest.json
            data/manifests/source_registry.csv
            data/manifests/column_dictionary.csv
            data/processed/bitcoin_daily.csv
            data/processed/median_household_income_annual.csv
            data/research/
            outputs/savings/latest/
          if-no-files-found: error
          retention-days: 30

      - name: Upload executed notebooks for publication verification
        if: success() && github.event_name != 'pull_request'
        id: upload-notebooks
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: executed-notebooks-${{ github.run_id }}
          path: build/executed-notebooks
          if-no-files-found: error
          retention-days: 14

      - name: Upload daily rendered HTML for GitHub Pages
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Refresh TLS certificate trust
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --only-upgrade -y ca-certificates
          # Enforce the emergency distrust even if this runner's apt mirror lags.
          sudo sed -i \
            -e 's|^mozilla/emSign_ECC_Root_CA_-_G3.crt$|!&|' \
            -e 's|^mozilla/emSign_Root_TLS_CA_-_G3.crt$|!&|' \
            -e 's|^mozilla/Comodo_AAA_Services_root.crt$|!&|' \
            /etc/ca-certificates.conf
          sudo update-ca-certificates
      - name: Check out the exact revision used to build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Download the validated publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/savings-publication

      - name: Download executed notebooks for freshness check
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.executed_notebooks_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/savings-publication/build/executed-notebooks

      - name: Restore only the verified public files
        run: python3 scripts/publication.py "${RUNNER_TEMP}/savings-publication"

      - name: Commit the daily snapshot
        run: |
          python3 scripts/check_changed_paths.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/manifests/data_manifest.json data/manifests/source_registry.csv data/manifests/column_dictionary.csv data/processed/bitcoin_daily.csv data/processed/median_household_income_annual.csv data/research/ outputs/savings/latest/
          if git diff --cached --quiet; then
            echo 'Published snapshot is already current.'
            exit 0
          fi
          REPORT_DATE=$(python3 -c 'import json; print(json.load(open("data/manifests/data_manifest.json"))["core_data_end"])')
          git commit -m "Update savings data and report through ${REPORT_DATE}"
          # A concurrent main change causes a safe failure; never force-push or
          # rebase generated data onto code it was not validated against.
          git push origin HEAD:main

      - name: Publish immutable quarter-end tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS=$(python3 -c 'import json; print(json.load(open("outputs/savings/latest/export_manifest.json"))["snapshot_status"])')
          if [ "${STATUS}" != "quarter_end" ]; then
            echo "Interim snapshot (${STATUS}); skipping quarter-end release."
            exit 0
          fi
          REPORT_DATE=$(python3 -c 'import json; print(json.load(open("outputs/savings/latest/export_manifest.json"))["report_date"])')
          TAG=$(python3 -c 'import json; d = json.load(open("outputs/savings/latest/export_manifest.json"))["report_date"]; y, m, _ = map(int, d.split("-")); print(f"savings-{y}-Q{(m - 1) // 3 + 1}")')
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Quarter-end tag ${TAG} already exists."
            exit 0
          fi
          git tag -a "${TAG}" -m "Quarter-end savings snapshot through ${REPORT_DATE}"
          git push origin "refs/tags/${TAG}"
          gh release create "${TAG}" outputs/savings/latest/* \
            --title "Savings Report ${TAG} (${REPORT_DATE})" \
            --notes "Immutable quarter-end savings report bundle through ${REPORT_DATE}."

  deploy-pages:
    needs: [build, publish]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy daily rendered notebooks to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
