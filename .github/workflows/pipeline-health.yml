name: Daily savings data and notebook

on:
  pull_request:
  schedule:
    - cron: "17 07 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: bitcoin-daily-savings-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      MPLBACKEND: module://matplotlib_inline.backend_inline
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Run regression contracts
        run: uv run --no-sync python -m unittest discover -s tests -v

      - name: Refresh shared data once
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python scripts/update_data.py

      - name: Validate shared release
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python scripts/validate_data.py

      - name: Execute the notebook
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python scripts/execute_notebooks.py --timeout 1200

      - name: Validate the notebook did not alter shared data
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python scripts/validate_data.py

      - name: Validate the savings report against this release
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python scripts/validate_savings_report.py

      - name: Restrict generated changes
        if: github.event_name != 'pull_request'
        run: uv run --no-sync python scripts/check_changed_paths.py

      - name: Upload validated run
        if: success() && github.event_name != 'pull_request'
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bitcoin-investment-strategy-${{ github.run_id }}
          path: |
            data/raw/brk/brk_daily.csv
            data/raw/fred/median_household_income.csv
            data/manifests/data_manifest.json
            data/manifests/source_registry.csv
            data/manifests/column_dictionary.csv
            data/processed/bitcoin_daily.csv
            data/processed/median_household_income_annual.csv
            notebooks/bitcoin_savings_plan.ipynb
            outputs/savings/latest/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact revision used to build
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Download the validated publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/savings-publication

      - name: Restore only the verified public files
        run: python3 scripts/publication.py "${RUNNER_TEMP}/savings-publication"

      - name: Commit the daily snapshot
        run: |
          python3 scripts/check_changed_paths.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/raw/brk/brk_daily.csv data/raw/fred/median_household_income.csv data/manifests/data_manifest.json data/manifests/source_registry.csv data/manifests/column_dictionary.csv data/processed/bitcoin_daily.csv data/processed/median_household_income_annual.csv notebooks/bitcoin_savings_plan.ipynb outputs/savings/latest/
          if git diff --cached --quiet; then
            echo 'Published snapshot is already current.'
            exit 0
          fi
          REPORT_DATE=$(python3 -c 'import json; print(json.load(open("data/manifests/data_manifest.json"))["core_data_end"])')
          git commit -m "Update savings data and report through ${REPORT_DATE}"
          # A concurrent main change causes a safe failure; never force-push or
          # rebase generated data onto code it was not validated against.
          git push origin HEAD:main
