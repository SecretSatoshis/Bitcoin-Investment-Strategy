[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-investment-strategy"
version = "0.1.0"
description = "Shared data pipeline for three public Bitcoin research notebooks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ipykernel==7.3.0",
  "jupyter-client==8.9.1",
  "matplotlib==3.11.1",
  "nbclient==0.11.0",
  "nbconvert==7.17.1",
  "nbformat==5.11.1",
  "numpy==2.5.2",
  "pandas==3.0.5",
  "requests==2.34.2",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]
