[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bitcoin-investment-strategy"
version = "0.1.0"
description = "Bitcoin savings-plan, supply and demand notebooks, their daily data releases and the savings report"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ipykernel==7.3.0",
  "jinja2==3.1.6",
  "jupyter-client==8.10.0",
  "matplotlib==3.11.2",
  "nbclient==0.11.0",
  "nbformat==5.11.1",
  "numpy==2.5.3",
  "pandas==3.0.6",
  "requests==2.34.2",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bitcoin_investment_strategy = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/fonts/*.md"]
